name: Build EDK2 SM-A205W

on:
  workflow_dispatch:
    inputs:
      edk2_ref:
        description: "Tag ou branche EDK2 (vide = branche par defaut)"
        required: false
        default: ""
  push:
    branches: [main, feature/kexec-arm64-virtual-boot]
    paths:
      - "EXYNOS7885Pkg/**"
      - "BootShim/**"
      - "build*.sh"
      - "firstrun.sh"
      - ".github/workflows/build-a205w.yml"
      - ".github/workflows/build-virtual-boot.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Le depot doit etre dans un dossier qui a le meme nom que sur ton PC,
      # avec edk2 et edk2-platforms a cote (voir README).
      - name: Checkout du depot
        uses: actions/checkout@v4
        with:
          path: edk2-exynos7885
          submodules: recursive

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev acpica-tools git nasm \
            python3 python3-setuptools gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Cloner EDK2 et edk2-platforms
        env:
          EDK2_REF: ${{ github.event.inputs.edk2_ref }}
        run: |
          if [ -z "$EDK2_REF" ]; then
            EDK2_REF="edk2-stable202605"
          fi
          git clone --recursive -b "$EDK2_REF" https://github.com/tianocore/edk2
          git clone https://github.com/tianocore/edk2-platforms.git
          sed -i 's/BaseUcs2Utf8Lib/Ucs2Utf8Lib/g' edk2-platforms/Features/Ext4Pkg/Ext4Dxe/Ext4Dxe.inf
          ls -la

      - name: Compiler
        working-directory: edk2-exynos7885
        run: |
          chmod +x *.sh
          ./firstrun.sh
          ./build.sh

      - name: Verifier le bundle EDK2
        working-directory: edk2-exynos7885/workspace
        run: |
          sha256sum -c SHA256SUMS
          python3 ../tools/verify_bundle.py
          test -s UEFI

      - name: Verifier le contrat de demarrage Alpine
        working-directory: edk2-exynos7885
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-virtual-boot.yml").read_text()
          required = {
              "attente du périphérique userdata mmcblk0p33":
                  "for dev in /dev/mmcblk0p33 /dev/block/mmcblk0p33",
              "montage ext4 de userdata":
                  'mount -t ext4 -o rw,noatime "$DATA_DEV" /mnt/data',
              "chemin Alpine sur userdata":
                  'ALPINE_ROOT="/mnt/data/media/0/UEFI/ALP/rootfs"',
              "contrôle de /sbin/init":
                  '[ ! -x "$ALPINE_ROOT/sbin/init" ]',
              "contrôle de BusyBox":
                  '[ ! -x "$ALPINE_ROOT/bin/busybox" ]',
              "bind mount du rootfs":
                  'mount --bind "$ALPINE_ROOT" /newroot',
              "transfert switch_root":
                  "switch_root /newroot /sbin/init",
          }

          missing = [name for name, marker in required.items() if marker not in workflow]
          if missing:
              raise SystemExit("Contrat Alpine incomplet: " + ", ".join(missing))

          manifest = """ALPINE ROOTFS - DEPLOYMENT CONTRACT
          Device: Samsung SM-A205W / Exynos 7885
          Filesystem: internal userdata (ext4)
          Android-side directory: /data/media/0/UEFI/ALP/rootfs
          Virtual Boot path after userdata mount: /mnt/data/media/0/UEFI/ALP/rootfs
          Required entry point: /sbin/init
          Required executable: /bin/busybox
          Handoff: switch_root /newroot /sbin/init

          The rootfs is deployed separately on the phone. It is intentionally
          not copied into this EDK2 artifact.
          """
          out = Path("workspace/ALPINE-ROOTFS-PATH.txt")
          out.write_text(manifest)
          print("Alpine handoff contract verified.")
          print("Deployment manifest:", out)
          PY
          cd workspace
          sha256sum ALPINE-ROOTFS-PATH.txt >> SHA256SUMS

      - name: Publier les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: a205w-edk2
          if-no-files-found: error
          path: |
            edk2-exynos7885/workspace/UEFI
            edk2-exynos7885/workspace/UEFI.manifest.json
            edk2-exynos7885/workspace/SHA256SUMS
            edk2-exynos7885/workspace/ALPINE-ROOTFS-PATH.txt
            edk2-exynos7885/workspace/Build/EXYNOS7885Pkg/DEBUG_GCC/FV/EXYNOS7885PKG_UEFI.fd
