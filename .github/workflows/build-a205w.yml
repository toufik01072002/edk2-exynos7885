name: Build EDK2 SM-A205W

on:
  workflow_dispatch:
    inputs:
      edk2_ref:
        description: "Tag ou branche EDK2 (vide = branche par defaut)"
        required: false
        default: ""
  push:
    branches: [main, virtual-boot-a20-dev]
    paths:
      - "EXYNOS7885Pkg/**"
      - "BootShim/**"
      - "build*.sh"
      - "firstrun.sh"
      - ".github/workflows/build-a205w.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Le depot doit etre dans un dossier qui a le meme nom que sur ton PC,
      # avec edk2 et edk2-platforms a cote (voir README).
      - name: Checkout du depot
        uses: actions/checkout@v4
        with:
          path: edk2-exynos7885
          submodules: recursive

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev acpica-tools git nasm \
            python3 python3-setuptools gcc-aarch64-linux-gnu \
            device-tree-compiler
          sudo sed -i '/^from gki\.generate_gki_certificate import generate_gki_certificate$/d' /usr/bin/mkbootimg

      - name: Cloner EDK2 et edk2-platforms
        env:
          EDK2_REF: ${{ github.event.inputs.edk2_ref }}
        run: |
          if [ -z "$EDK2_REF" ]; then
            EDK2_REF="edk2-stable202605"
          fi
          git clone --recursive -b "$EDK2_REF" https://github.com/tianocore/edk2
          git clone https://github.com/tianocore/edk2-platforms.git
          ls -la

      - name: Compiler
        working-directory: edk2-exynos7885
        run: |
          chmod +x *.sh
          ./firstrun.sh
          ./build.sh

      - name: Verifier le bundle non flashable
        working-directory: edk2-exynos7885/workspace
        run: |
          test -s UEFI
          test -s UEFI.manifest.json
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          with open("UEFI.manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["bootable"] is False
          assert manifest["launch_enabled"] is False
          assert manifest["safety"]["flashable_images_created"] is False
          print("EDK2 bundle verified; launch remains disabled.")
          PY

      - name: Publier le bundle EDK2 non flashable
        uses: actions/upload-artifact@v4
        with:
          name: a205w-edk2-bundle-only
          if-no-files-found: error
          path: |
            edk2-exynos7885/workspace/UEFI
            edk2-exynos7885/workspace/UEFI.manifest.json
            edk2-exynos7885/workspace/SHA256SUMS
