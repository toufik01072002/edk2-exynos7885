name: Audit A20 virtual boot inputs

on:
  workflow_dispatch:
  push:
    branches:
      - virtual-boot-a20-dev
    paths:
      - "virtual-boot/**"
      - ".github/workflows/audit-virtual-boot.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      ANDROID_MAJOR_VERSION: p
    timeout-minutes: 120
    steps:
      - name: Checkout EDK2 development branch
        uses: actions/checkout@v4
        with:
          ref: virtual-boot-a20-dev
          path: edk2-exynos7885
          persist-credentials: false

      - name: Checkout A20 device inputs
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/android_device_samsung_a20
          ref: virtual-boot-a20-dev
          path: sources/android_device_samsung_a20
          persist-credentials: false

      - name: Checkout A20 kernel sources
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/Kernel_SM-A205W
          ref: virtual-boot-a20-dev
          path: sources/Kernel_SM-A205W
          persist-credentials: false

      - name: Install DTB inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler wget xz-utils

      - name: Install Android GCC 4.9 toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/423c0265176bcabd1c885f8cf6f0cedf67d3f59b.tar.gz" \
            -O /tmp/gcc49.tar.gz
          tar -xzf /tmp/gcc49.tar.gz -C "$GITHUB_WORKSPACE/toolchain"
          test -x "$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-gcc"
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-gcc" --version

      - name: Record exact source revisions
        run: |
          {
            echo "edk2-exynos7885=$(git -C edk2-exynos7885 rev-parse HEAD)"
            echo "android_device_samsung_a20=$(git -C sources/android_device_samsung_a20 rev-parse HEAD)"
            echo "Kernel_SM-A205W=$(git -C sources/Kernel_SM-A205W rev-parse HEAD)"
          } | tee virtual-boot-source-refs.txt

      - name: Apply reviewed ARM64 kexec DTB handoff patch
        run: |
          python3 edk2-exynos7885/virtual-boot/tools/apply_kexec_dtb_patch.py \
            --kernel-source sources/Kernel_SM-A205W
          echo "kexec_dtb_patch_sha256=$(sha256sum edk2-exynos7885/virtual-boot/tools/apply_kexec_dtb_patch.py | cut -d' ' -f1)" \
            | tee -a virtual-boot-source-refs.txt


      - name: Build patched ARM64 kernel and merge A20 CAN SINGLE 05 DTB
        run: |
          make -C sources/Kernel_SM-A205W O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- exynos7885-a20_defconfig
          make -C sources/Kernel_SM-A205W O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- olddefconfig
          mkdir -p sources/Kernel_SM-A205W/out/init sources/Kernel_SM-A205W/out/firmware
          cp sources/Kernel_SM-A205W/init/uh.elf sources/Kernel_SM-A205W/out/init/uh.elf
          cp sources/Kernel_SM-A205W/firmware/exynos7885_acpm_fvp.fw sources/Kernel_SM-A205W/out/firmware/exynos7885_acpm_fvp.fw
          test -s sources/Kernel_SM-A205W/out/init/uh.elf
          test -s sources/Kernel_SM-A205W/out/firmware/exynos7885_acpm_fvp.fw
          make -C sources/Kernel_SM-A205W -j"$(nproc)" O=out HOSTCFLAGS=-fcommon ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- Image dtbs
          test -s sources/Kernel_SM-A205W/out/arch/arm64/boot/Image

          BASE="sources/Kernel_SM-A205W/out/arch/arm64/boot/dts/exynos/dtbo/exynos7885.dtb"
          OVERLAY="sources/Kernel_SM-A205W/out/arch/arm64/boot/dts/exynos/dtbo/exynos7884B-a20_can_single_05.dtbo"

          test -s "$BASE"
          test -s "$OVERLAY"
          fdtoverlay -i "$BASE" -o a20-can-single-05-merged.dtb "$OVERLAY"
          dtc -I dtb -O dts -o a20-can-single-05-merged.dts a20-can-single-05-merged.dtb

          MODEL="$(fdtget a20-can-single-05-merged.dtb / model)"
          echo "Merged DTB model: $MODEL"
          echo "$MODEL" | grep -F "A20 CAN SINGLE 05"
          {
            echo "base_dtb_sha256=$(sha256sum "$BASE" | cut -d' ' -f1)"
            echo "overlay_dtbo_sha256=$(sha256sum "$OVERLAY" | cut -d' ' -f1)"
            echo "merged_dtb_sha256=$(sha256sum a20-can-single-05-merged.dtb | cut -d' ' -f1)"
            echo "model=$MODEL"
            echo "status=MERGED_FOR_ANALYSIS_ONLY_NOT_BOOTABLE"
          } | tee a20-dtb-candidate-report.txt


          dtc -@ -I dts -O dtb \
            -o a20-virtual-memory.dtbo \
            edk2-exynos7885/virtual-boot/dts/a20-virtual-memory.dts
          fdtoverlay -i a20-can-single-05-merged.dtb \
            -o a20-virtual-boot-memory.dtb a20-virtual-memory.dtbo

          fdtput -d a20-virtual-boot-memory.dtb /chosen linux,initrd-start
          fdtput -d a20-virtual-boot-memory.dtb /chosen linux,initrd-end
          BOOTARGS="$(fdtget a20-virtual-boot-memory.dtb /chosen bootargs)"
          BOOTARGS="$(printf '%s\n' "$BOOTARGS" | sed -E 's/(^|[[:space:]])skip_initramfs([[:space:]]|$)/ /g' | tr -s ' ' | sed 's/^ //;s/ $//')"
          fdtput -t s a20-virtual-boot-memory.dtb /chosen bootargs "$BOOTARGS"

          dtc -I dtb -O dts -o a20-virtual-boot-memory.dts a20-virtual-boot-memory.dtb
          MODEL="$(fdtget a20-virtual-boot-memory.dtb / model)"
          echo "Virtual DTB model: $MODEL"
          echo "$MODEL" | grep -F "A20 CAN SINGLE 05"
          BANK2="$(fdtget -t x a20-virtual-boot-memory.dtb /memory@880000000 reg)"
          EDK2_RESERVED="$(fdtget -t x a20-virtual-boot-memory.dtb /reserved-memory/edk2_uefi@90000000 reg)"
          echo "Bank2 cells: $BANK2"
          echo "EDK2 reservation cells: $EDK2_RESERVED"
          echo "$BANK2" | grep -Eiq "^0*8 0*80000000 0*40000000$"
          echo "$EDK2_RESERVED" | grep -Eiq "^0*0 0*90000000 0*200000$"
          ! fdtget a20-virtual-boot-memory.dtb /chosen bootargs | grep -q skip_initramfs
          ! fdtget a20-virtual-boot-memory.dtb /chosen linux,initrd-start >/dev/null 2>&1
          ! fdtget a20-virtual-boot-memory.dtb /chosen linux,initrd-end >/dev/null 2>&1

          {
            echo "memory_overlay_sha256=$(sha256sum a20-virtual-memory.dtbo | cut -d' ' -f1)"
            echo "virtual_dtb_sha256=$(sha256sum a20-virtual-boot-memory.dtb | cut -d' ' -f1)"
            echo "bank0=$(fdtget -t x a20-virtual-boot-memory.dtb /memory@80000000 reg)"
            echo "bank1=$(fdtget -t x a20-virtual-boot-memory.dtb /memory@C0000000 reg)"
            echo "bank2=$(fdtget -t x a20-virtual-boot-memory.dtb /memory@880000000 reg)"
            echo "edk2_reserved=$(fdtget -t x a20-virtual-boot-memory.dtb /reserved-memory/edk2_uefi@90000000 reg)"
            echo "status=MEMORY_MAP_PATCHED_ANALYSIS_ONLY_NOT_BOOTABLE"
          } | tee a20-virtual-memory-report.txt


      - name: Audit kernel, DTB and embedded kernel configuration
        run: |
          python3 edk2-exynos7885/virtual-boot/tools/audit_inputs.py \
            --kernel sources/Kernel_SM-A205W/out/arch/arm64/boot/Image \
            --dtb a20-virtual-boot-memory.dtb \
            --a20-overlay sources/Kernel_SM-A205W/arch/arm64/boot/dts/exynos/dtbo/exynos7884B-a20_can_single_05.dts \
            --kernel-source sources/Kernel_SM-A205W \
            --report virtual-boot-audit.json

      - name: Build diagnostic initramfs and non-bootable candidate
        run: |
          sudo apt-get install -y cpio file
          sudo dpkg --add-architecture arm64
          cat > /tmp/arm64.sources <<'SOURCES'
          Types: deb
          URIs: https://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo apt-get -o Dir::Etc::sourcelist=/tmp/arm64.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          apt-get -o Dir::Etc::sourcelist=/tmp/arm64.sources -o Dir::Etc::sourceparts=- download busybox-static:arm64

          mkdir -p busybox-arm64 initramfs-root/bin candidate
          dpkg-deb -x busybox-static_*_arm64.deb busybox-arm64
          BUSYBOX="$(find busybox-arm64 -type f -name busybox -print -quit)"
          test -n "$BUSYBOX"
          file "$BUSYBOX" | grep -E "ARM aarch64|aarch64"
          if readelf -l "$BUSYBOX" | grep -q "INTERP"; then
            echo "ERROR: BusyBox is dynamically linked"
            exit 1
          fi

          install -m 0755 "$BUSYBOX" initramfs-root/bin/busybox
          for applet in sh mount mkdir cat tr grep sleep; do
            ln -s busybox "initramfs-root/bin/$applet"
          done
          install -m 0755 edk2-exynos7885/virtual-boot/initramfs/init initramfs-root/init
          sh -n initramfs-root/init

          mkdir -p initramfs-root/dev initramfs-root/proc initramfs-root/sys initramfs-root/run initramfs-root/tmp
          (
            cd initramfs-root
            find . -print0 | cpio --null --create --format=newc --owner=0:0 | gzip -9
          ) > initramfs.cpio.gz
          gzip -t initramfs.cpio.gz
          gzip -dc initramfs.cpio.gz | cpio --list

          install -m 0644 sources/Kernel_SM-A205W/out/arch/arm64/boot/Image candidate/Image
          install -m 0644 a20-virtual-boot-memory.dtb candidate/a20-virtual-boot-memory.dtb
          install -m 0644 initramfs.cpio.gz candidate/initramfs.cpio.gz

          cat > candidate/STATUS.txt <<'STATUS'
          NOT BOOTABLE — ANALYSIS CANDIDATE ONLY
          This archive is not approved for kexec or device boot.
          The DTB initrd addresses are cleared for dynamic placement; no verified loader supplies them yet.
          The three-bank RAM map and audited carveouts are patched for analysis, not runtime-validated.
          The CI-built kernel includes the DTB-in-x0 patch; no device execution has been attempted.
          No RAM reservation or DMA-quiescence handoff has been implemented.
          EDK2 execution is disabled. No flash partitions are modified.
          STATUS

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("candidate")
          def digest(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          files = {}
          for name in ("Image", "a20-virtual-boot-memory.dtb", "initramfs.cpio.gz", "STATUS.txt"):
              p = root / name
              files[name] = {"size": p.stat().st_size, "sha256": digest(p)}
          manifest = {
              "format": "7K-A20-VIRTUAL-BOOT-CANDIDATE",
              "format_version": 1,
              "device": "Samsung SM-A205W",
              "board": "A20 CAN SINGLE 05",
              "soc": "Exynos 7885 / Exynos 7884B",
              "launch_enabled": False,
              "bootable": False,
              "files": files,
              "required_work_remaining": [
                  "implement a verified runtime loader that sets initrd addresses dynamically",
                  "validate the corrected RAM banks and carveout reservations against the live device map",
                  "prove memory reservation for all loaded segments",
                  "quiesce DMA-capable devices before handoff",
                  "validate the patched Linux ARM64 DTB-in-x0 ABI before any device launch",
                  "implement the separate BootShim-to-EDK2 CPU-state and firmware-entry contract",
                  "validate a minimal device tree and safe console path"
              ]
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          lines = [f"{v['sha256']}  {k}" for k, v in files.items()]
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY

          tar -czf a20-virtual-boot-candidate.tar.gz -C candidate .
          sha256sum a20-virtual-boot-candidate.tar.gz

      - name: Upload audit and non-bootable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A20-VIRTUAL-BOOT-AUDIT-${{ github.sha }}
          path: |
            virtual-boot-audit.json
            virtual-boot-source-refs.txt
            a20-can-single-05-merged.dtb
            a20-virtual-memory.dtbo
            a20-virtual-boot-memory.dtb
            a20-virtual-boot-memory.dts
            a20-virtual-memory-report.txt
            a20-can-single-05-merged.dts
            a20-dtb-candidate-report.txt
            initramfs.cpio.gz
            a20-virtual-boot-candidate.tar.gz
            candidate/manifest.json
            candidate/SHA256SUMS
            candidate/STATUS.txt
          if-no-files-found: error
          retention-days: 30
