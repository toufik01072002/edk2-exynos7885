name: Audit A20 virtual boot inputs

on:
  workflow_dispatch:
  push:
    branches:
      - virtual-boot-a20-dev
    paths:
      - "virtual-boot/**"
      - ".github/workflows/audit-virtual-boot.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      ANDROID_MAJOR_VERSION: p
    timeout-minutes: 30
    steps:
      - name: Checkout EDK2 development branch
        uses: actions/checkout@v4
        with:
          ref: virtual-boot-a20-dev
          path: edk2-exynos7885
          persist-credentials: false

      - name: Checkout A20 device inputs
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/android_device_samsung_a20
          ref: virtual-boot-a20-dev
          path: sources/android_device_samsung_a20
          persist-credentials: false

      - name: Checkout A20 kernel sources
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/Kernel_SM-A205W
          ref: virtual-boot-a20-dev
          path: sources/Kernel_SM-A205W
          persist-credentials: false

      - name: Install DTB inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler wget xz-utils

      - name: Install Android GCC 4.9 toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/423c0265176bcabd1c885f8cf6f0cedf67d3f59b.tar.gz" \
            -O /tmp/gcc49.tar.gz
          tar -xzf /tmp/gcc49.tar.gz -C "$GITHUB_WORKSPACE/toolchain"
          test -x "$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-gcc"
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-gcc" --version

      - name: Record exact source revisions
        run: |
          {
            echo "edk2-exynos7885=$(git -C edk2-exynos7885 rev-parse HEAD)"
            echo "android_device_samsung_a20=$(git -C sources/android_device_samsung_a20 rev-parse HEAD)"
            echo "Kernel_SM-A205W=$(git -C sources/Kernel_SM-A205W rev-parse HEAD)"
          } | tee virtual-boot-source-refs.txt

      - name: Build and merge the A20 CAN SINGLE 05 device tree
        run: |
          make -C sources/Kernel_SM-A205W O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- exynos7885-a20_defconfig
          make -C sources/Kernel_SM-A205W O=out HOSTCFLAGS=-fcommon ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- dtbs

          BASE="sources/Kernel_SM-A205W/out/arch/arm64/boot/dts/exynos/dtbo/exynos7885.dtb"
          OVERLAY="sources/Kernel_SM-A205W/out/arch/arm64/boot/dts/exynos/dtbo/exynos7884B-a20_can_single_05.dtbo"

          test -s "$BASE"
          test -s "$OVERLAY"
          fdtoverlay -i "$BASE" -o a20-can-single-05-merged.dtb "$OVERLAY"
          dtc -I dtb -O dts -o a20-can-single-05-merged.dts a20-can-single-05-merged.dtb

          MODEL="$(fdtget a20-can-single-05-merged.dtb / model)"
          echo "Merged DTB model: $MODEL"
          echo "$MODEL" | grep -F "A20 CAN SINGLE 05"
          {
            echo "base_dtb_sha256=$(sha256sum "$BASE" | cut -d' ' -f1)"
            echo "overlay_dtbo_sha256=$(sha256sum "$OVERLAY" | cut -d' ' -f1)"
            echo "merged_dtb_sha256=$(sha256sum a20-can-single-05-merged.dtb | cut -d' ' -f1)"
            echo "model=$MODEL"
            echo "status=MERGED_FOR_ANALYSIS_ONLY_NOT_BOOTABLE"
          } | tee a20-dtb-candidate-report.txt


      - name: Audit kernel, DTB and embedded kernel configuration
        run: |
          python3 edk2-exynos7885/virtual-boot/tools/audit_inputs.py \
            --kernel sources/android_device_samsung_a20/prebuilt/kexec/Image \
            --dtb a20-can-single-05-merged.dtb \
            --a20-overlay sources/Kernel_SM-A205W/arch/arm64/boot/dts/exynos/dtbo/exynos7884B-a20_can_single_05.dts \
            --kernel-source sources/Kernel_SM-A205W \
            --report virtual-boot-audit.json

      - name: Build diagnostic initramfs and non-bootable candidate
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y cpio file
          apt-get download busybox-static:arm64

          mkdir -p busybox-arm64 initramfs-root/bin candidate
          dpkg-deb -x busybox-static_*_arm64.deb busybox-arm64
          BUSYBOX="$(find busybox-arm64 -type f -name busybox -print -quit)"
          test -n "$BUSYBOX"
          file "$BUSYBOX" | grep -E "ARM aarch64|aarch64"
          if readelf -l "$BUSYBOX" | grep -q "INTERP"; then
            echo "ERROR: BusyBox is dynamically linked"
            exit 1
          fi

          install -m 0755 "$BUSYBOX" initramfs-root/bin/busybox
          for applet in sh mount mkdir cat tr grep sleep; do
            ln -s busybox "initramfs-root/bin/$applet"
          done
          install -m 0755 edk2-exynos7885/virtual-boot/initramfs/init initramfs-root/init
          sh -n initramfs-root/init

          mkdir -p initramfs-root/dev initramfs-root/proc initramfs-root/sys initramfs-root/run initramfs-root/tmp
          (
            cd initramfs-root
            find . -print0 | cpio --null --create --format=newc --owner=0:0 | gzip -9
          ) > initramfs.cpio.gz
          gzip -t initramfs.cpio.gz
          gzip -dc initramfs.cpio.gz | cpio --list

          install -m 0644 sources/android_device_samsung_a20/prebuilt/kexec/Image candidate/Image
          install -m 0644 a20-can-single-05-merged.dtb candidate/a20-can-single-05.dtb
          install -m 0644 initramfs.cpio.gz candidate/initramfs.cpio.gz

          cat > candidate/STATUS.txt <<'STATUS'
          NOT BOOTABLE — ANALYSIS CANDIDATE ONLY
          This archive is not approved for kexec or device boot.
          The DTB still contains fixed linux,initrd-start/end properties.
          The current kexec relocation path clears x0-x3 before branching.
          No RAM reservation or DMA-quiescence handoff has been implemented.
          EDK2 execution is disabled. No flash partitions are modified.
          STATUS

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("candidate")
          def digest(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          files = {}
          for name in ("Image", "a20-can-single-05.dtb", "initramfs.cpio.gz", "STATUS.txt"):
              p = root / name
              files[name] = {"size": p.stat().st_size, "sha256": digest(p)}
          manifest = {
              "format": "7K-A20-VIRTUAL-BOOT-CANDIDATE",
              "format_version": 1,
              "device": "Samsung SM-A205W",
              "board": "A20 CAN SINGLE 05",
              "soc": "Exynos 7885 / Exynos 7884B",
              "launch_enabled": False,
              "bootable": False,
              "files": files,
              "required_work_remaining": [
                  "remove or dynamically set fixed initrd properties using a verified runtime loader",
                  "prove memory reservation for all loaded segments",
                  "quiesce DMA-capable devices before handoff",
                  "implement and validate the ARM64 kexec-to-EDK2 register and exception-level contract",
                  "validate a minimal device tree and safe console path"
              ]
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\\n")
          lines = [f"{v['sha256']}  {k}" for k, v in files.items()]
          (root / "SHA256SUMS").write_text("\\n".join(lines) + "\\n")
          PY

          tar -czf a20-virtual-boot-candidate.tar.gz -C candidate .
          sha256sum a20-virtual-boot-candidate.tar.gz

      - name: Upload audit and non-bootable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A20-VIRTUAL-BOOT-AUDIT-${{ github.sha }}
          path: |
            virtual-boot-audit.json
            virtual-boot-source-refs.txt
            a20-can-single-05-merged.dtb
            a20-can-single-05-merged.dts
            a20-dtb-candidate-report.txt
            initramfs.cpio.gz
            a20-virtual-boot-candidate.tar.gz
            candidate/manifest.json
            candidate/SHA256SUMS
            candidate/STATUS.txt
          if-no-files-found: error
          retention-days: 30
