name: Build Virtual Boot ARM64 (SM-A205W)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-virtual-boot.yml'
      - 'virtual-boot/**'
      - 'EXYNOS7885Pkg/Include/Configuration/DeviceMemoryMap.h'
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch (must be kexec-arm64-4.4-d-work)"
        required: true
        default: "kexec-arm64-4.4-d-work"
      kernel_commit:
        description: "Expected commit SHA (1e70ef871acb9ea0cd79a531b18e98f61debfc71)"
        required: true
        default: "1e70ef871acb9ea0cd79a531b18e98f61debfc71"

permissions:
  contents: read

concurrency:
  group: virtual-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Virtual Boot Kernel + DTB
    runs-on: ubuntu-22.04
    env:
      ANDROID_MAJOR_VERSION: p
    timeout-minutes: 120
    outputs:
      kernel_sha256: ${{ steps.hash_kernel.outputs.sha256 }}
      dtb_sha256: ${{ steps.hash_dtb.outputs.sha256 }}
      kernel_commit: ${{ steps.checkout_kernel.outputs.commit }}
    steps:
      - name: Checkout Virtual Boot project
        uses: actions/checkout@v4
        with:
          path: virtual-boot-project
          submodules: false

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev device-tree-compiler \
            wget xz-utils

      - name: Install Android GCC 4.9
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/423c0265176bcabd1c885f8cf6f0cedf67d3f59b.tar.gz" \
            -O /tmp/gcc49.tar.gz
          tar -xzf /tmp/gcc49.tar.gz \
            -C "$GITHUB_WORKSPACE/toolchain"
          test -x toolchain/bin/aarch64-linux-android-gcc
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-gcc" --version

      - name: Clone Kernel_SM-A205W (correct branch)
        id: checkout_kernel
        env:
          KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'kexec-arm64-4.4-d-work' }}
          EXPECTED_COMMIT: ${{ github.event.inputs.kernel_commit || '1e70ef871acb9ea0cd79a531b18e98f61debfc71' }}
        run: |
          git clone --recursive https://github.com/toufik01072002/Kernel_SM-A205W.git kernel-src
          cd kernel-src
          git checkout "$KERNEL_REF"
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          echo "Actual commit: $ACTUAL_COMMIT"
          echo "Expected commit: $EXPECTED_COMMIT"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Commit mismatch!"
            echo "Expected: $EXPECTED_COMMIT"
            echo "Got:      $ACTUAL_COMMIT"
            exit 1
          fi
          echo "commit=$ACTUAL_COMMIT" >> $GITHUB_OUTPUT

      - name: Verify kernel commit
        id: verify_commit
        run: |
          cd kernel-src
          git log -1 --format="%H %s"

      - name: Apply Virtual Boot kernel compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sched = Path('kernel-src/include/trace/events/sched.h')
          sched_source = sched.read_text()
          sched_needle = '#include <linux/binfmts.h>\n'
          if 'struct rt_rq;' not in sched_source:
              if sched_source.count(sched_needle) != 1:
                  raise SystemExit('Cannot locate unique binfmts include in sched trace header')
              sched_source = sched_source.replace(sched_needle, sched_needle + '\n/* Forward declaration for scheduler tracepoint prototypes. */\nstruct rt_rq;\n', 1)
              sched.write_text(sched_source)
          nmi = Path('kernel-src/include/linux/nmi.h')
          nmi_source = nmi.read_text()
          nmi_broken = 'static inline void void sl_softirq_entry(const char *, void *) { }'
          nmi_fixed = 'static inline void sl_softirq_entry(const char *desc, void *data) { }'
          if nmi_broken in nmi_source:
              nmi.write_text(nmi_source.replace(nmi_broken, nmi_fixed, 1))
          elif nmi_fixed not in nmi_source:
              raise SystemExit('Cannot locate sl_softirq_entry inline declaration')
          tune = Path('kernel-src/kernel/sched/tune.h')
          tune_source = tune.read_text()
          tune_needle = '#ifdef CONFIG_SCHED_TUNE\n'
          if 'struct cpufreq_policy;' not in tune_source:
              if tune_source.count(tune_needle) != 1:
                  raise SystemExit('Cannot locate CONFIG_SCHED_TUNE guard in tune.h')
              tune_source = tune_source.replace(tune_needle, tune_needle + '\nstruct cpufreq_policy;\nstruct freqvar_boost_data;\n', 1)
              tune.write_text(tune_source)
          sched_h = Path('kernel-src/kernel/sched/sched.h')
          sched_h_source = sched_h.read_text()
          scale_anchor = '#define arch_scale_freq_invariant()    (true)\n#endif\n'
          scale_fallback = '\n#ifndef arch_scale_freq_invariant\n#ifdef CONFIG_HMP_FREQUENCY_INVARIANT_SCALE\n#define arch_scale_freq_invariant() (true)\n#else\n#define arch_scale_freq_invariant() (false)\n#endif\n#endif\n'
          if '#ifndef arch_scale_freq_invariant' not in sched_h_source:
              if sched_h_source.count(scale_anchor) != 1:
                  raise SystemExit('Cannot locate arch_scale_freq_invariant fallback point')
              sched_h.write_text(sched_h_source.replace(scale_anchor, scale_anchor + scale_fallback, 1))
          cpufreq = Path('kernel-src/kernel/sched/cpufreq_schedutil.c')
          cpufreq_source = cpufreq.read_text()
          init_call = '\t/* init freqvar_boost */\n\tschedtune_freqvar_boost_init(policy, &tunables->freqvar_boost);\n'
          guarded_init = '#ifdef CONFIG_FREQVAR_SCHEDTUNE\n' + init_call + '#endif\n'
          if init_call in cpufreq_source:
              cpufreq_source = cpufreq_source.replace(init_call, guarded_init, 1)
          elif guarded_init not in cpufreq_source:
              raise SystemExit('Cannot locate schedutil freqvar init call')
          exit_one = '\tschedtune_freqvar_boost_exit(policy, &tunables->freqvar_boost);\n'
          exit_two = '\t\tschedtune_freqvar_boost_exit(policy, &tunables->freqvar_boost);\n'
          for exit_call in (exit_one, exit_two):
              guarded_exit = '#ifdef CONFIG_FREQVAR_SCHEDTUNE\n' + exit_call + '#endif\n'
              if exit_call in cpufreq_source:
                  cpufreq_source = cpufreq_source.replace(exit_call, guarded_exit, 1)
              elif guarded_exit not in cpufreq_source:
                  raise SystemExit('Cannot locate a schedutil freqvar exit call')
          cpufreq.write_text(cpufreq_source)
          gpu_makefile = Path('kernel-src/drivers/gpu/Makefile')
          gpu_source = gpu_makefile.read_text()
          gpu_old = 'obj-y\t\t\t+= drm/ vga/ arm/\n'
          gpu_new = 'obj-y\t\t\t+= drm/ vga/\nobj-$(CONFIG_MALI_TMIX)\t+= arm/\n'
          if gpu_old in gpu_source:
              gpu_makefile.write_text(gpu_source.replace(gpu_old, gpu_new, 1))
          elif gpu_new not in gpu_source:
              raise SystemExit('Cannot locate optional ARM GPU directory entry')
          cmdq_header = Path('kernel-src/drivers/mmc/host/cmdq_hci.h')
          cmdq_source = cmdq_header.read_text()
          cmdq_anchor = '\tvoid (*clear_set_dumpregs)(struct mmc_host *mmc, bool set);\n'
          crypto_field = '\tint (*crypto_cfg)(struct mmc_host *mmc, struct mmc_request *mrq, u32 slot);\n'
          if 'crypto_cfg(' not in cmdq_source:
              if cmdq_source.count(cmdq_anchor) != 1:
                  raise SystemExit('Cannot locate CMDQ host ops insertion point')
              cmdq_header.write_text(cmdq_source.replace(cmdq_anchor, cmdq_anchor + crypto_field, 1))
          itmon = Path('kernel-src/drivers/trace/exynos7885-itmon.c')
          itmon_source = itmon.read_text()
          old_itmon = '\tunsigned int val;\n\tint ret;\n\n\tret = exynos_pmu_read(EXYNOS_PMU_BURNIN_CTRL, &val);\n\tret = exynos_pmu_write(EXYNOS_PMU_BURNIN_CTRL, val | BIT_ENABLE_DBGSEL_WDTRESET);'
          new_itmon = '\tunsigned int val = 0;\n\tint ret;\n\n\tret = exynos_pmu_read(EXYNOS_PMU_BURNIN_CTRL, &val);\n\tif (ret)\n\t\treturn;\n\tret = exynos_pmu_write(EXYNOS_PMU_BURNIN_CTRL, val | BIT_ENABLE_DBGSEL_WDTRESET);'
          if old_itmon in itmon_source:
              itmon.write_text(itmon_source.replace(old_itmon, new_itmon, 1))
          elif new_itmon not in itmon_source:
              raise SystemExit('Cannot locate ITMON PMU read sequence')
          snapshot = Path('kernel-src/drivers/trace/exynos-ss.c')
          snapshot_source = snapshot.read_text()
          sec_debug_call = '\t\tif (sec_debug_get_debug_level() &&\n'
          sec_debug_guard = '#if defined(CONFIG_SEC_EXT) && defined(CONFIG_SEC_DEBUG)\n' + sec_debug_call
          secure_dump_call = '\t\t\texynos_sdm_dump_secure_region();\n'
          if sec_debug_call in snapshot_source:
              if snapshot_source.count(sec_debug_call) != 1 or snapshot_source.count(secure_dump_call) != 1:
                  raise SystemExit('Cannot locate unique optional SEC_DEBUG snapshot calls')
              snapshot_source = snapshot_source.replace(sec_debug_call, sec_debug_guard, 1)
              snapshot_source = snapshot_source.replace(secure_dump_call, secure_dump_call + '#endif /* CONFIG_SEC_EXT && CONFIG_SEC_DEBUG */\n', 1)
              snapshot.write_text(snapshot_source)
          elif sec_debug_guard in snapshot_source and '#endif /* CONFIG_SEC_EXT && CONFIG_SEC_DEBUG */' in snapshot_source:
              pass
          else:
              raise SystemExit('Cannot locate SEC_DEBUG snapshot call guard point')
          condbg = Path('kernel-src/drivers/trace/exynos-condbg.c')
          condbg_source = condbg.read_text()
          fn_start = condbg_source.find('int ecd_start_binary(unsigned long jump_addr)')
          fn_end = condbg_source.find('\nint ecd_init_binary(', fn_start)
          if fn_start < 0 or fn_end < 0:
              raise SystemExit('Cannot isolate ecd_start_binary() for stack fix')
          fn_source = condbg_source[fn_start:fn_end]
          stack_table = '\tset_param_fn_t fn[SZ_256] = {0, };\n'
          dynamic_table = '\tset_param_fn_t *fn;\n\tint fw_loaded;\n'
          allocation = '\tfn = kcalloc(SZ_256, sizeof(*fn), GFP_KERNEL);\n\tif (!fn)\n\t\treturn -ENOMEM;\n'
          return_anchor = '\treturn interface->fw_loaded;\n'
          return_replacement = '\tfw_loaded = interface->fw_loaded;\n\tkfree(fn);\n\treturn fw_loaded;\n'
          if stack_table in fn_source:
              if fn_source.count(stack_table) != 1:
                  raise SystemExit('ECD function table declaration is not unique')
              fn_source = fn_source.replace(stack_table, dynamic_table, 1)
              allocation_anchor = '\t/* Set/Get parameter */\n\tset_param(fn);\n'
              if fn_source.count(allocation_anchor) != 1:
                  raise SystemExit('ECD function table initialization anchor is not unique')
              fn_source = fn_source.replace(allocation_anchor, allocation + allocation_anchor, 1)
              if fn_source.count(return_anchor) != 1:
                  raise SystemExit('ECD function return anchor is not unique')
              fn_source = fn_source.replace(return_anchor, return_replacement, 1)
              condbg.write_text(condbg_source[:fn_start] + fn_source + condbg_source[fn_end:])
          elif dynamic_table in fn_source and 'kcalloc(SZ_256, sizeof(*fn), GFP_KERNEL)' in fn_source and 'kfree(fn);' in fn_source:
              pass
          else:
              raise SystemExit('Cannot locate ECD stack table or verify dynamic allocation fix')
          # Resolve known vendor-only references for a standalone virtual-boot kernel.
          ss = Path('kernel-src/drivers/trace/exynos-ss.c')
          ss_source = ss.read_text()
          ss_start = ss_source.find('        for_each_possible_cpu(cpu)')
          ss_end = ss_source.find('\n        }', ss_start)
          if ss_start >= 0 and ss_end > ss_start:
              ss_source = ss_source[:ss_start] + '\t\t/* CPU power-state table is not part of the standalone boot target. */' + ss_source[ss_end + len('\n        }'):]
              decl = '\tunsigned cpu, core, mpidr;\n'
              if decl in ss_source:
                  ss_source = ss_source.replace(decl, '', 1)
              ss.write_text(ss_source)
          elif 'exynos_cpu.power_state(cpu)' in ss_source:
              raise SystemExit('Cannot isolate optional exynos_ss CPU power-state loop')
          powermode = Path('kernel-src/drivers/soc/samsung/exynos-powermode.c')
          powermode_source = powermode.read_text()
          wait_loop = '\t\t\twhile (exynos_cpu.cluster_state(cpu))\n\t\t\t\tudelay(1);'
          if wait_loop in powermode_source:
              powermode_source = powermode_source.replace(wait_loop, '\t\t\t/* No vendor cluster-state table in the virtual-boot target. */', 1)
              powermode.write_text(powermode_source)
          elif 'exynos_cpu.cluster_state(cpu)' in powermode_source:
              raise SystemExit('Cannot isolate optional cpuidle cluster-state wait')
          # MMC command-queue diagnostics are not required for the standalone EFI boot target.
          queue = Path('kernel-src/drivers/mmc/card/queue.c')
          queue_source = queue.read_text()
          cmdq_call = '\\tcmdq_dumpregs(cq_host);'
          if cmdq_call in queue_source:
              if queue_source.count(cmdq_call) != 1:
                  raise SystemExit('MMC CMDQ diagnostic call is not unique')
              queue.write_text(queue_source.replace(cmdq_call, '\\t/* CMDQ register dump omitted in virtual boot. */', 1))
          elif 'cmdq_dumpregs(cq_host);' in queue_source:
              raise SystemExit('Cannot isolate MMC CMDQ diagnostic call')
          gadget = Path('kernel-src/drivers/usb/dwc3/gadget.c')
          gadget_source = gadget.read_text()
          gadget_old = 'extern bool acc_dev_status;'
          gadget_new = 'bool acc_dev_status;'
          if gadget_old in gadget_source:
              gadget_source = gadget_source.replace(gadget_old, gadget_new, 1)
              gadget.write_text(gadget_source)
          elif gadget_new not in gadget_source:
              raise SystemExit('Cannot locate DWC3 accessory-state declaration')
          hid = Path('kernel-src/drivers/hid/hid-input.c')
          hid_source = hid.read_text()
          hid_old = 'extern bool lcd_is_on;'
          hid_new = 'bool lcd_is_on = true;'
          if hid_old in hid_source:
              hid_source = hid_source.replace(hid_old, hid_new, 1)
              hid.write_text(hid_source)
          elif hid_new not in hid_source:
              raise SystemExit('Cannot locate HID LCD-state declaration')
          mct = Path('kernel-src/drivers/clocksource/exynos_mct.c')
          mct_source = mct.read_text()
          mct_source = mct_source.replace('extern struct atomic_notifier_head hardlockup_notifier_list;\n', '', 1)
          dump_start = mct_source.find('static void exynos4_mct_tick_dump(unsigned int cpu)')
          handler_start = mct_source.find('static int exynos4_mct_hardlockup_handler', dump_start)
          handler_end = mct_source.find('\nstatic int exynos4_local_timer_setup', handler_start)
          if dump_start >= 0 and handler_start > dump_start and handler_end > handler_start:
              mct_source = mct_source[:dump_start] + mct_source[handler_end:]
          elif 'static int exynos4_mct_hardlockup_handler' in mct_source:
              raise SystemExit('Cannot isolate optional MCT hard-lockup callback')
          notifier_start = mct_source.find('static struct notifier_block nb_hardlockup_block = {')
          if notifier_start >= 0:
              notifier_end = mct_source.find('\n};', notifier_start)
              if notifier_end < 0:
                  raise SystemExit('Cannot isolate MCT hard-lockup notifier block')
              mct_source = mct_source[:notifier_start] + mct_source[notifier_end + len('\n};'):]
          register = '\tatomic_notifier_chain_register(&hardlockup_notifier_list, &nb_hardlockup_block);\n'
          if register in mct_source:
              mct_source = mct_source.replace(register, '', 1)
          elif 'atomic_notifier_chain_register(&hardlockup_notifier_list' in mct_source:
              raise SystemExit('Cannot remove optional MCT hard-lockup notifier registration')
          mct_source = mct_source.replace('extern struct atomic_notifier_head hardlockup_notifier_list;\\n', '')
          mct_source = mct_source.replace('atomic_notifier_chain_register(&hardlockup_notifier_list, &nb_hardlockup_block);', '/* optional hard-lockup notifier omitted for virtual boot */')
          if 'hardlockup_notifier_list' in mct_source:
              raise SystemExit('Unresolved MCT hardlockup notifier reference remains')
          mct.write_text(mct_source)
          if 'exynos_cpu.' in ss.read_text():
              raise SystemExit('Unresolved Exynos snapshot CPU-state reference remains')
          if 'exynos_cpu.' in powermode.read_text():
              raise SystemExit('Unresolved Exynos powermode CPU-state reference remains')
          ehci_hub = Path('kernel-src/drivers/usb/host/ehci-hub.c')
          ehci_source = ehci_hub.read_text()
          ehci_old = '\t\t\t\tehci_vdbg (ehci, "port %d reset\\n", wIndex + 1);'
          ehci_new = '\t\t\t\tehci_dbg (ehci, "port %d reset\\n", wIndex + 1);'
          if ehci_old in ehci_source:
              if ehci_source.count(ehci_old) != 1:
                  raise SystemExit('EHCI verbose debug call is not unique')
              ehci_hub.write_text(ehci_source.replace(ehci_old, ehci_new, 1))
          elif ehci_new not in ehci_source:
              raise SystemExit('Cannot locate EHCI verbose debug call compatibility point')
          PY
          git -C kernel-src diff --check
          grep -Fq 'struct rt_rq;' kernel-src/include/trace/events/sched.h
          grep -Fq 'static inline void sl_softirq_entry' kernel-src/include/linux/nmi.h
          grep -Fq 'struct cpufreq_policy;' kernel-src/kernel/sched/tune.h
          grep -Fq '#ifndef arch_scale_freq_invariant' kernel-src/kernel/sched/sched.h
          grep -Fq 'ehci_dbg (ehci, "port %d reset' kernel-src/drivers/usb/host/ehci-hub.c
          ! grep -Fq 'exynos_cpu.power_state(cpu)' kernel-src/drivers/trace/exynos-ss.c
          ! grep -Fq 'exynos_cpu.cluster_state(cpu)' kernel-src/drivers/soc/samsung/exynos-powermode.c
          grep -Fq 'bool acc_dev_status;' kernel-src/drivers/usb/dwc3/gadget.c
          grep -Fq 'bool lcd_is_on = true;' kernel-src/drivers/hid/hid-input.c

      - name: Copy Virtual Boot kernel config
        run: |
          cp virtual-boot-project/virtual-boot/kernel/config_virtual_boot kernel-src/arch/arm64/configs/virtual_boot_defconfig

      - name: Configure Virtual Boot
        run: |
          cd kernel-src
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            virtual_boot_defconfig

          # Exclude Android-only services that are not part of the EFI boot environment.
          bash scripts/config --file out/.config --disable SEC_DEBUG --disable SEC_EXT \
            --disable F2FS_FS --disable TRUSTONIC_TEE --disable TRUSTONIC_TRUSTED_UI \
            --disable SECURE_OS_CONTROL --disable SECURE_OS_BOOSTER_API

          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          ! grep -qx 'CONFIG_F2FS_FS=y' out/.config || { echo 'ERROR: F2FS must be disabled for standalone target'; exit 1; }
          ! grep -qx 'CONFIG_TRUSTONIC_TEE=y' out/.config || { echo 'ERROR: Trustonic TEE must be disabled for standalone target'; exit 1; }

          echo '=== Effective kernel configuration ==='
          grep -E '^(CONFIG_(KEXEC|ECT|NR_CPUS|SCHED_HMP|SOC_SAMSUNG|DISABLE_CPU_SCHED_DOMAIN_BALANCE|CGROUP_SCHED|FAIR_GROUP_SCHED|SCHED_AUTOGROUP)=|# CONFIG_(ECT|SCHED_AUTOGROUP) is not set)' out/.config || true
          grep -qx 'CONFIG_KEXEC=y' out/.config || { echo 'ERROR: CONFIG_KEXEC is not enabled'; exit 1; }
          grep -qx 'CONFIG_SOC_SAMSUNG=y' out/.config || { echo 'ERROR: CONFIG_SOC_SAMSUNG is not enabled'; exit 1; }
          if grep -qx 'CONFIG_ECT=y' out/.config; then echo 'ERROR: CONFIG_ECT must remain disabled'; exit 1; fi
          grep -qx 'CONFIG_NR_CPUS=8' out/.config || { echo 'ERROR: CONFIG_NR_CPUS must be 8'; exit 1; }
          grep -qx 'CONFIG_SCHED_HMP=y' out/.config || { echo 'ERROR: CONFIG_SCHED_HMP dependencies are not satisfied'; exit 1; }

      - name: Prepare embedded binaries for out-of-tree build
        run: |
          cd kernel-src
          mkdir -p out/init out/firmware
          cp init/uh.elf out/init/uh.elf
          cp firmware/exynos7885_acpm_fvp.fw out/firmware/exynos7885_acpm_fvp.fw
          test -s out/init/uh.elf
          test -s out/firmware/exynos7885_acpm_fvp.fw

      - name: Build kernel Image
        working-directory: kernel-src
        run: |
          make -j"$(nproc)" O=out \
            HOSTCFLAGS=-fcommon \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            Image

      - name: Preprocess and compile Virtual Boot DTB
        run: |
          mkdir -p virtual-boot-output
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp -I kernel-src/include -I kernel-src/arch/arm64/boot/dts -I kernel-src/arch/arm64/boot/dts/exynos/dtbo -o virtual-boot-output/exynos7885-a205w-virtual.pp.dts virtual-boot-project/virtual-boot/dtb/exynos7885-a205w-virtual.dts
          dtc -@ -I dts -O dtb -o virtual-boot-output/exynos7885-a205w-virtual.dtb virtual-boot-output/exynos7885-a205w-virtual.pp.dts
          echo "Virtual Boot DTB size: $(wc -c < virtual-boot-output/exynos7885-a205w-virtual.dtb) bytes"

      - name: Verify kernel and DTB artifacts
        run: |
          test -f kernel-src/out/arch/arm64/boot/Image
          test -f virtual-boot-output/exynos7885-a205w-virtual.dtb
          echo "Kernel size: $(wc -c < kernel-src/out/arch/arm64/boot/Image) bytes"
          echo "Virtual Boot DTB size: $(wc -c < virtual-boot-output/exynos7885-a205w-virtual.dtb) bytes"

      - name: Generate kernel SHA256
        id: hash_kernel
        run: |
          sha256=$(sha256sum kernel-src/out/arch/arm64/boot/Image | cut -d' ' -f1)
          echo "sha256=$sha256" >> $GITHUB_OUTPUT

      - name: Generate Virtual Boot DTB SHA256
        id: hash_dtb
        run: |
          sha256=$(sha256sum virtual-boot-output/exynos7885-a205w-virtual.dtb | cut -d' ' -f1)
          echo "sha256=$sha256" >> $GITHUB_OUTPUT

      - name: Stage kernel artifacts
        run: |
          mkdir -p kernel-artifacts
          cp kernel-src/out/arch/arm64/boot/Image kernel-artifacts/Image
          cp virtual-boot-output/exynos7885-a205w-virtual.dtb kernel-artifacts/exynos7885-a205w-virtual.dtb

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-boot-kernel
          path: kernel-artifacts/

  build-initramfs:
    name: Build initramfs
    runs-on: ubuntu-22.04
    needs: build-kernel
    outputs:
      initramfs_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout Virtual Boot project
        uses: actions/checkout@v4
        with:
          path: virtual-boot-project
          submodules: false

      - name: Install initramfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu \
            wget cpio gzip

      - name: Build BusyBox static ARM64
        env:
          BUSYBOX_VERSION: "1.36.1"
        run: |
          wget "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"
          tar xf "busybox-${BUSYBOX_VERSION}.tar.bz2"
          cd "busybox-${BUSYBOX_VERSION}"
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/# CONFIG_FEATURE_INDIVIDUAL is not set/CONFIG_FEATURE_INDIVIDUAL=y/' .config
          sed -i 's/# CONFIG_KEXEC is not set/CONFIG_KEXEC=y/' .config
          make -j$(nproc) CC=aarch64-linux-gnu-gcc

      - name: Create initramfs structure
        run: |
          mkdir -p initramfs/{bin,sbin,etc,proc,sys,dev,lib,lib64,mnt,root,tmp,var,run}
          mkdir -p initramfs/usr/{bin,sbin,lib,lib64}

      - name: Copy BusyBox and create symlinks
        run: |
          cp busybox-*/busybox initramfs/bin/
          cd initramfs/bin
          for app in sh ash bash ls cat cp mv rm mkdir rmdir mount umount \
            insmod rmmod modprobe lsmod dmesg kexec reboot sync sleep \
            echo printf test true false sha256sum md5sum hexdump dd \
            find grep awk sed vi more less head tail wc sort uniq \
            tar gzip gunzip cpio chmod chown chroot pivot_root switch_root \
            mkdir mkfifo mknod; do
            ln -sf busybox $app
          done
          cd ../..

      - name: Create init script (diagnostic only - Phase 1)
        run: |
          cat > initramfs/init << 'INITEOF'
          #!/bin/busybox sh
          # Virtual Boot init - SM-A205W Exynos 7885 (Phase 1)
          # Diagnostic environment only - no UEFI handoff yet

          export PATH=/bin:/sbin:/usr/bin:/usr/sbin
          export HOME=/root

          # Mount essential filesystems
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev
          mount -t tmpfs none /run
          mount -t tmpfs none /tmp

          # Set up console
          exec 0</dev/console
          exec 1>/dev/console
          exec 2>/dev/console

          echo "=========================================="
          echo "Virtual Boot ARM64 - Samsung SM-A205W"
          echo "Exynos 7885 - Phase 1: Diagnostic Environment"
          echo "=========================================="
          echo ""

          # Diagnostic information
          echo "[INFO] CPU info:"
          cat /proc/cpuinfo | head -30
          echo ""

          echo "[INFO] Memory info:"
          cat /proc/meminfo | head -20
          echo ""

          echo "[INFO] Memory map (iomem):"
          cat /proc/iomem | grep -E "(System RAM|reserved|uefi|tima|seclog|cma|framebuffer|modem|gnss|wifi|abox)" | head -40
          echo ""

          echo "[INFO] Kernel command line:"
          cat /proc/cmdline
          echo ""

          echo "[INFO] DTB info:"
          if [ -f /proc/device-tree/model ]; then
            echo "Model: $(cat /proc/device-tree/model)"
          fi
          if [ -f /proc/device-tree/compatible ]; then
            echo "Compatible: $(cat /proc/device-tree/compatible)"
          fi
          echo ""

          # Check for UEFI FD at expected location
          echo "[INFO] Checking for UEFI FD at 0x90000000..."
          if [ -c /dev/mem ]; then
            dd if=/dev/mem of=/tmp/uefi_check.bin bs=1 count=8 skip=$((0x90000030)) 2>/dev/null
            if hexdump -C /tmp/uefi_check.bin 2>/dev/null | grep -q "41 52 4d 36"; then
              echo "[OK] ARM64 magic found at 0x90000030 - UEFI FD present"
            else
              echo "[WARN] ARM64 magic NOT found at 0x90000030"
            fi
          else
            echo "[WARN] /dev/mem not available"
          fi
          echo ""

          # Interactive shell for diagnostics
          echo "[INFO] Entering diagnostic shell."
          echo "[INFO] Available: hwinfo, dmesg, cat /proc/*, ls /sys/*, etc."
          echo "[INFO] Phase 2 will add automated UEFI handoff."
          echo ""
          exec /bin/sh
          INITEOF
          chmod +x initramfs/init

      - name: Create hardware info script
        run: |
          cat > initramfs/sbin/hwinfo << 'HWINFOEOF'
          #!/bin/busybox sh
          # hwinfo - Display hardware information for SM-A205W

          echo "=== Samsung SM-A205W Hardware Information ==="
          echo ""
          echo "Model: $(cat /proc/device-tree/model 2>/dev/null || echo 'Unknown')"
          echo "Compatible: $(cat /proc/device-tree/compatible 2>/dev/null || echo 'Unknown')"
          echo ""
          echo "=== CPU ==="
          cat /proc/cpuinfo | grep -E "(Processor|CPU|Hardware|Revision|Features)" | head -20
          echo ""
          echo "=== Memory ==="
          cat /proc/meminfo | head -20
          echo ""
          echo "=== Memory Map (iomem) ==="
          cat /proc/iomem | grep -E "(System RAM|reserved|uefi|tima|seclog|cma|framebuffer|modem|gnss|wifi|abox|bootshim)"
          echo ""
          echo "=== Kernel Command Line ==="
          cat /proc/cmdline
          echo ""
          echo "=== Device Tree Memory Nodes ==="
          if [ -d /proc/device-tree ]; then
            for mem in /proc/device-tree/memory*; do
              if [ -f "$mem/reg" ]; then
                echo "$mem/reg: $(hexdump -C $mem/reg | head -1)"
              fi
            done
          fi
          echo ""
          echo "=== Reserved Memory ==="
          if [ -d /proc/device-tree/reserved-memory ]; then
            for r in /proc/device-tree/reserved-memory/*; do
              if [ -f "$r/reg" ]; then
                echo "$r: $(hexdump -C $r/reg | head -1)"
                [ -f "$r/compatible" ] && echo "  compatible: $(cat $r/compatible)"
                [ -f "$r/no-map" ] && echo "  no-map: yes"
                [ -f "$r/reusable" ] && echo "  reusable: yes"
              fi
            done
          fi
          echo ""
          echo "=== Kernel Version ==="
          uname -a
          HWINFOEOF
          chmod +x initramfs/sbin/hwinfo

      - name: Build initramfs
        run: |
          cd initramfs
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../initramfs.cpio.gz
          cd ..

      - name: Verify initramfs
        run: |
          test -f initramfs.cpio.gz
          echo "Initramfs size: $(wc -c < initramfs.cpio.gz) bytes"
          mkdir -p test_extract
          cd test_extract
          gzip -dc ../initramfs.cpio.gz | cpio -id
          test -f init
          test -x bin/busybox
          test -x sbin/hwinfo
          cd ..

      - name: Generate SHA256
        id: hash
        run: |
          sha256=$(sha256sum initramfs.cpio.gz | cut -d' ' -f1)
          echo "sha256=$sha256" >> $GITHUB_OUTPUT

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-boot-initramfs
          path: initramfs.cpio.gz

  validate-dtb:
    name: Validate DTB Binary
    runs-on: ubuntu-22.04
    needs: build-kernel
    steps:
      - name: Checkout Virtual Boot project
        uses: actions/checkout@v4
        with:
          path: virtual-boot-project
          submodules: false

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: virtual-boot-kernel
          path: kernel-artifacts

      - name: Install DTB validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Run binary DTB validation
        run: |
          python3 virtual-boot-project/virtual-boot/scripts/validate_dtb_binary.py \
            kernel-artifacts/exynos7885-a205w-virtual.dtb \
            virtual-boot-project/EXYNOS7885Pkg/Include/Configuration/DeviceMemoryMap.h

      - name: Confirm memory-map validator completed
        run: echo "Binary DTB and DeviceMemoryMap.h checks completed successfully."

  build-bundle:
    name: Create Virtual Boot Bundle
    runs-on: ubuntu-22.04
    needs: [build-kernel, build-initramfs, validate-dtb]
    steps:
      - name: Checkout Virtual Boot project
        uses: actions/checkout@v4
        with:
          path: virtual-boot-project
          submodules: false

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: virtual-boot-kernel
          path: kernel-artifacts

      - name: Download initramfs artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-boot-initramfs
          path: initramfs-artifacts

      - name: Verify all artifacts exist
        run: |
          test -f kernel-artifacts/Image
          test -f kernel-artifacts/exynos7885-a205w-virtual.dtb
          test -f initramfs-artifacts/initramfs.cpio.gz
          echo "All artifacts present"

      - name: Create bundle directory
        run: |
          mkdir -p virtual-boot-output

      - name: Copy artifacts with correct names
        run: |
          cp kernel-artifacts/Image virtual-boot-output/
          cp kernel-artifacts/exynos7885-a205w-virtual.dtb virtual-boot-output/exynos7885-a205w-virtual.dtb
          cp initramfs-artifacts/initramfs.cpio.gz virtual-boot-output/

      - name: Include kernel compatibility patch
        run: |
          mkdir -p virtual-boot-output/patches
          cp virtual-boot-project/virtual-boot/patches/0001-forward-declare-rt-rq.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0002-fix-nmi-inline-declaration.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0003-fix-sched-tune-forward-declarations.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0004-fix-schedutil-config-guards.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0005-gpu-arm-makefile-conditional.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0006-fix-mmc-cmdq-and-itmon.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0007-guard-sec-debug-snapshot-calls.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0008-move-exynos-condbg-function-table-off-stack.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0009-fix-ehci-verbose-debug-call.patch virtual-boot-output/patches/
          cp virtual-boot-project/virtual-boot/patches/0010-fix-virtual-boot-link-dependencies.patch virtual-boot-output/patches/

      - name: Generate hardware manifest with REAL data
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          GIT_COMMIT: ${{ needs.build-kernel.outputs.kernel_commit }}
          KERNEL_SHA256: ${{ needs.build-kernel.outputs.kernel_sha256 }}
          DTB_SHA256: ${{ needs.build-kernel.outputs.dtb_sha256 }}
          INITRAMFS_SHA256: ${{ needs.build-initramfs.outputs.initramfs_sha256 }}
        run: |
          BUILD_DATE="${BUILD_DATE:-$(date -u +%Y%m%dT%H%M%SZ)}"
          test -n "$GIT_COMMIT"
          test -n "$KERNEL_SHA256"
          test -n "$DTB_SHA256"
          test -n "$INITRAMFS_SHA256"
          cat > virtual-boot-output/hardware-manifest.json << MANIFESTEOF
          {
            "format": "VIRTUAL-BOOT-ARM64",
            "format_version": 1,
            "platform": "Samsung SM-A205W / Exynos 7885",
            "architecture": "AARCH64",
            "model": "Samsung Galaxy A20 (SM-A205W)",
            "codename": "a20",
            "build_date": "$BUILD_DATE",
            "git_commit": "$GIT_COMMIT",
            "kernel": {
              "source": "https://github.com/toufik01072002/Kernel_SM-A205W",
              "branch": "kexec-arm64-4.4-d-work",
              "commit": "$GIT_COMMIT",
              "config": "virtual-boot-minimal",
              "image": "Image",
              "load_address": "0x80080000",
              "sha256": "$KERNEL_SHA256",
              "patches": ["patches/0001-forward-declare-rt-rq.patch", "patches/0002-fix-nmi-inline-declaration.patch", "patches/0003-fix-sched-tune-forward-declarations.patch", "patches/0004-fix-schedutil-config-guards.patch", "patches/0005-gpu-arm-makefile-conditional.patch", "patches/0006-fix-mmc-cmdq-and-itmon.patch", "patches/0007-guard-sec-debug-snapshot-calls.patch", "patches/0008-move-exynos-condbg-function-table-off-stack.patch", "patches/0009-fix-ehci-verbose-debug-call.patch", "patches/0010-fix-virtual-boot-link-dependencies.patch"]
            },
            "dtb": {
              "source": "Virtual Boot-specific DTS derived from Samsung hardware definitions",
              "reference_base_dts": "arch/arm64/boot/dts/exynos/dtbo/exynos7885.dts",
              "reference_a20_overlay": "arch/arm64/boot/dts/exynos/dtbo/exynos7884B-a20_common.dtsi",
              "file": "exynos7885-a205w-virtual.dtb",
              "load_address": "0x88000000",
              "sha256": "$DTB_SHA256"
            },
            "initramfs": {
              "base": "BusyBox 1.36.1 static",
              "file": "initramfs.cpio.gz",
              "load_address": "0x84000000",
              "sha256": "$INITRAMFS_SHA256"
            },
            "memory_map": {
              "bank0": "0x80000000-0xBBC00000 (956 MiB)",
              "bank1": "0xC0000000-0x100000000 (1024 MiB)",
              "bank2": "0x880000000-0x8C0000000 (1024 MiB, >4GB)",
              "uefi_fd": "0x90000000-0x90200000 (2 MiB)",
              "reserved": [
                "TIMA: 0xB8000000-0xB8200000",
                "seclog: 0xC0000000-0xC0080000",
                "WiFi/BT: 0xE9000000-0xE9400000",
                "ABOX: 0xE9400000-0xE9800000",
                "Framebuffer: 0xEC000000-0xED400000",
                "CMA video_stream: 0xF0C00000-0xF5400000",
                "Modem: 0xF5400000-0xFDC00000",
                "CP RAM logging: 0xFDC00000-0xFFC00000",
                "GNSS: 0xFFC00000-0x100000000",
                "CMA cma-3: 0x8BA000000-0x8BB400000",
                "CMA crypto: 0x8BB800000-0x8BD800000",
                "CMA video_frame: 0x8BD800000-0x8C0000000"
              ]
            },
            "kexec": {
              "kernel_entry": "0x80080000",
              "dtb_addr": "0x88000000",
              "initrd_addr": "0x84000000",
              "uefi_handoff_addr": "0x90000000",
              "note": "Phase 1 only - trampoline not assigned"
            },
            "validation": {
              "dtb_memory_map": "PASSED - binary DTB validated via dtc/fdtget",
              "dtb_source_authentic": "Samsung-derived; directly includes exynos7885-pm-domains.dtsi, with other nodes adapted in the Virtual Boot DTS",
              "dtb_validation_method": "dtc/fdtget binary DTB parsing against DeviceMemoryMap.h"
            }
          }
          MANIFESTEOF
          python3 -m json.tool virtual-boot-output/hardware-manifest.json >/dev/null

      - name: Generate SHA256SUMS
        run: |
          cd virtual-boot-output
          sha256sum Image exynos7885-a205w-virtual.dtb initramfs.cpio.gz patches/0001-forward-declare-rt-rq.patch patches/0002-fix-nmi-inline-declaration.patch patches/0003-fix-sched-tune-forward-declarations.patch patches/0004-fix-schedutil-config-guards.patch patches/0005-gpu-arm-makefile-conditional.patch patches/0006-fix-mmc-cmdq-and-itmon.patch patches/0007-guard-sec-debug-snapshot-calls.patch patches/0008-move-exynos-condbg-function-table-off-stack.patch patches/0009-fix-ehci-verbose-debug-call.patch patches/0010-fix-virtual-boot-link-dependencies.patch hardware-manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Copy documentation
        run: |
          cp virtual-boot-project/virtual-boot/docs/LAUNCH.md virtual-boot-output/
          cp virtual-boot-project/virtual-boot/docs/VALIDATION_REPORT.md virtual-boot-output/

      - name: Upload Virtual Boot bundle
        uses: actions/upload-artifact@v4
        with:
          name: virtual-boot-bundle
          path: virtual-boot-output/
          if-no-files-found: error

      - name: Display summary
        run: |
          echo "=== Virtual Boot ARM64 Bundle Created ==="
          ls -la virtual-boot-output/
          echo ""
          cat virtual-boot-output/SHA256SUMS